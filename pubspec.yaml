name: mindful_campus
description: Mindful Campus - student mental wellness companion.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  url_launcher: ^6.3.0
  fl_chart: ^1.0.0
  audioplayers: ^6.0.0
  share_plus: ^10.0.0
  country_flags: ^3.1.0
  pdf: ^3.10.8
  csv: ^6.0.0
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 👈 ADDED: The icon generator package
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icon/ # 👈 ADDED: So Flutter knows where your icon image is

# 👈 ADDED: The configuration for your custom icon at the very bottom
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  # Optional: Matches the dark green background of your logo for newer Android phones
  adaptive_icon_background: "#0B1B15"
  adaptive_icon_foreground: "assets/icon/app_icon.png"